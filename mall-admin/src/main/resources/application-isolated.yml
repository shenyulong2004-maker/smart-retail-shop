# ==========================================
# mall-admin 隔离环境配置
# MySQL 使用 3307 端口，避开主机已有的 3306
# ==========================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3308/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 20
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        login-username: druid
        login-password: druid
  data:
    redis:
      host: localhost
      database: 0
      port: 6379
      password:
      timeout: 300ms

minio:
  endpoint: http://localhost:9090
  bucketName: mall
  accessKey: minioadmin
  secretKey: minioadmin

logging:
  level:
    root: info
    com.macro.mall: debug

logstash:
  host: localhost
  enableInnerLog: false
